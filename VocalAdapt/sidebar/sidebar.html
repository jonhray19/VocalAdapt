<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VoiceAssist Admin Sidebar</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        // Custom soft blue for a calming aesthetic
                        brand: {
                            400: '#60a5fa',
                            500: '#3b82f6',
                            50: '#eff6ff'
                        }
                    }
                }
            }
        }
    </script>
    <style>
        /* Smoother, less obtrusive custom scrollbar */
        .custom-scrollbar::-webkit-scrollbar {
            width: 5px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: transparent;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #27272a; /* zinc-800 */
            border-radius: 10px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: #3f3f46; /* zinc-700 */
        }
    </style>
</head>
<body class="bg-gray-50 flex min-h-screen antialiased text-gray-800">

    <!-- 
      =======================================================================
      BEGIN SIDEBAR FRAGMENT 
      Copy everything inside this <aside> tag for your sidebar.html
      =======================================================================
    -->
    
    <!-- Added 'sticky top-0' to fix the scrolling height issue -->
    <aside class="flex flex-col h-screen sticky top-0 w-72 bg-zinc-950 text-zinc-400 border-r border-zinc-800/60 shadow-xl relative overflow-hidden transition-all duration-300 z-20">
        
        <!-- Ultra-soft decorative ambient glow -->
        <div class="absolute -top-24 left-1/2 -translate-x-1/2 w-64 h-64 bg-brand-500/10 rounded-full blur-[100px] pointer-events-none"></div>

        <!-- Header / Logo -->
        <div class="px-6 py-6 border-b border-zinc-800/50 relative z-10">
            <div class="flex items-center gap-3">
                <!-- Softened Voice/Tech Logo Icon -->
                <div class="flex items-center justify-center w-10 h-10 rounded-xl bg-zinc-900 border border-zinc-700/50 text-brand-400 shadow-sm">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="w-5 h-5">
                        <path d="M13.5 4.06c0-1.336-1.616-2.005-2.56-1.06l-4.5 4.5H4.508c-1.141 0-2.318.664-2.66 1.905A9.76 9.76 0 0 0 1.5 12c0 .898.121 1.768.35 2.595.341 1.24 1.518 1.905 2.659 1.905h1.93l4.5 4.5c.945.945 2.561.276 2.561-1.06V4.06ZM18.584 5.106a.75.75 0 0 1 1.06 0c3.808 3.807 3.808 9.98 0 13.788a.75.75 0 0 1-1.06-1.06 8.25 8.25 0 0 0 0-11.668.75.75 0 0 1 0-1.06Z" />

                    </svg>
                </div>
                <div>
                    <h2 class="text-lg font-semibold text-zinc-100 tracking-tight leading-tight">VoiceAssist</h2>
                    <span class="text-[10px] font-medium text-zinc-500 uppercase tracking-widest">Admin Portal</span>
                </div>
            </div>
        </div>
        
        <!-- Navigation -->
        <nav class="flex-1 px-4 py-6 space-y-1.5 overflow-y-auto custom-scrollbar relative z-10">
            
            <!-- Inactive Link: Analytics -->
            <a href="../teacher/index.html" class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-zinc-400 hover:text-zinc-100 hover:bg-zinc-800/50 transition-all duration-200 group">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5 h-5 group-hover:scale-110 transition-transform text-zinc-500 group-hover:text-brand-400">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M3 13.125C3 12.504 3.504 12 4.125 12h2.25c.621 0 1.125.504 1.125 1.125v6.75C7.5 20.496 6.996 21 6.375 21h-2.25A1.125 1.125 0 0 1 3 19.875v-6.75ZM9.75 8.625c0-.621.504-1.125 1.125-1.125h2.25c.621 0 1.125.504 1.125 1.125v11.25c0 .621-.504 1.125-1.125 1.125h-2.25a1.125 1.125 0 0 1-1.125-1.125V8.625ZM16.5 4.125c0-.621.504-1.125 1.125-1.125h2.25C20.496 3 21 3.504 21 4.125v15.75c0 .621-.504 1.125-1.125 1.125h-2.25a1.125 1.125 0 0 1-1.125-1.125V4.125Z" />

                </svg>
                <span class="text-sm font-medium">Student Roster</span>
            </a>
            
            <!-- Inactive Link: Question Bank -->
            <a href="../teacher/create-question.html" class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-zinc-400 hover:text-zinc-100 hover:bg-zinc-800/50 transition-all duration-200 group">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5 h-5 group-hover:scale-110 transition-transform text-zinc-500 group-hover:text-brand-400">

                <span class="text-sm font-medium">Question Bank</span>

                <!-- Delicate Active Indicator Line -->
                <div class="absolute left-0 top-1/2 -translate-y-1/2 h-1/2 w-[3px] bg-brand-400 rounded-r-full"></div>
                
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="w-5 h-5 text-brand-400">

                    <path d="M19.5 7.5a.75.75 0 0 1 .75-.75h1.5v-1.5a.75.75 0 0 1 1.5 0v1.5h1.5a.75.75 0 0 1 0 1.5h-1.5v1.5a.75.75 0 0 1-1.5 0v-1.5h-1.5a.75.75 0 0 1-.75-.75Z" />
                </svg>
                <span class="text-sm font-medium">Enroll Student</span>
            </a>
            
            <div class="pt-6 pb-2">
                <p class="px-3 text-[11px] font-semibold text-zinc-600 uppercase tracking-widest">External</p>
            </div>
            
            <!-- External Link -->
            <a href="../student/index.html" target="_blank" class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-zinc-400 hover:text-zinc-100 hover:bg-zinc-800/50 transition-all duration-200 group">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5 h-5 group-hover:rotate-12 transition-transform text-zinc-500 group-hover:text-amber-300">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M4.26 10.147a60.438 60.438 0 0 0-.491 6.347A48.62 48.62 0 0 1 12 20.904a48.62 48.62 0 0 1 8.232-4.41 60.46 60.46 0 0 0-.491-6.347m-15.482 0a50.636 50.636 0 0 0-2.658-.813A59.906 59.906 0 0 1 12 3.493a59.903 59.903 0 0 1 10.399 5.84c-.896.248-1.783.52-2.658.814m-15.482 0A50.717 50.717 0 0 1 12 13.489a50.702 50.702 0 0 1 7.74-3.342M6.75 15a.75.75 0 1 0 0-1.5.75.75 0 0 0 0 1.5Zm0 0v-3.675A55.378 55.378 0 0 1 12 8.443m-7.007 11.55A5.981 5.981 0 0 0 6.75 15.75v-1.5" />
                </svg>
                <span class="text-sm font-medium">Student Portal</span>
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" class="w-4 h-4 ml-auto opacity-40 group-hover:opacity-100 transition-opacity">
                    <path fill-rule="evenodd" d="M4.25 5.5a.75.75 0 0 0-.75.75v8.5c0 .414.336.75.75.75h8.5a.75.75 0 0 0 .75-.75v-4a.75.75 0 0 1 1.5 0v4A2.25 2.25 0 0 1 12.75 17h-8.5A2.25 2.25 0 0 1 2 14.75v-8.5A2.25 2.25 0 0 1 4.25 4h5a.75.75 0 0 1 0 1.5h-5Z" clip-rule="evenodd" />
                    <path fill-rule="evenodd" d="M6.194 12.753a.75.75 0 0 0 1.06.053L16.5 4.44v2.81a.75.75 0 0 0 1.5 0v-4.5a.75.75 0 0 0-.75-.75h-4.5a.75.75 0 0 0 0 1.5h2.553l-9.056 8.194a.75.75 0 0 0-.053 1.06Z" clip-rule="evenodd" />

        </nav>
        
        <!-- Footer / User Profile & Logout -->
        <div class="p-4 relative z-10 border-t border-zinc-800/60 bg-zinc-950/80 backdrop-blur-md">
            <!-- Mini Profile Card -->
            <div class="flex items-center gap-3 px-3 py-2.5 mb-3 rounded-lg bg-zinc-900 border border-zinc-800/80 shadow-sm">
                <div class="relative">
                    <img id="sidebar-user-avatar" src="https://ui-avatars.com/api/?name=User&background=3b82f6&color=fff&rounded=true" alt="User Avatar" class="w-9 h-9 rounded-full ring-2 ring-zinc-800">
                    <div class="absolute bottom-0 right-0 w-2.5 h-2.5 bg-emerald-500 rounded-full border-2 border-zinc-900"></div>
                </div>
                <div class="flex flex-col flex-1 min-w-0">
                    <span id="sidebar-user-name" class="text-sm font-medium text-zinc-200 truncate">Loading...</span>
                    <span id="sidebar-user-email" class="text-[11px] text-zinc-500 truncate">Loading...</span>
                </div>
            </div>

            <!-- Enhanced Logout Button (Softer Red) -->
            <button id="teacher-logout-btn" class="w-full flex items-center justify-center gap-2 py-2 text-sm font-medium text-zinc-500 rounded-lg hover:text-rose-400 hover:bg-rose-500/10 transition-all duration-200 group border border-transparent">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5 h-5 group-hover:-translate-x-1 transition-transform">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 9V5.25A2.25 2.25 0 0 0 13.5 3h-6a2.25 2.25 0 0 0-2.25 2.25v13.5A2.25 2.25 0 0 0 7.5 21h6a2.25 2.25 0 0 0 2.25-2.25V15M12 9l-3 3m0 0 3 3m-3-3h12.75" />
                </svg>
                Sign Out
            </button>
        </div>
    </aside>
    
    

</body>
</html>
